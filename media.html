
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media & Hospital Information - Urine Test Strip Reader System</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #F6F1E7;
            color: #2F3E2F;
        }

        header {
            background: linear-gradient(135deg, #DCCFB3, #A8B99A);
            text-align: center;
            padding: 30px;
            border-bottom: 4px solid #355E3B;
        }

        header h1 {
            margin: 0;
            color: #2D4F34;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background-color: #FFFCF7;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 18px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #355E3B;
        }

        video,
        audio {
            width: 100%;
            margin-top: 15px;
        }

        iframe {
            width: 100%;
            height: 450px;
            border: 0;
            border-radius: 12px;
        }

        noscript {
            display: block;
            background-color: #FFE6E6;
            color: #B00000;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 20px;
        }

        footer {
            text-align: center;
            background-color: #355E3B;
            color: white;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Media & Hospital Information</h1>
        <p>Urine Test Strip Reader System</p>
    </header>

    <div class="container">

        <!-- Video Section -->

        <div class="card">

            <h2>Healthcare Awareness Video</h2>

            <!-- Replace awareness-video.mp4 with your video file -->

            <video controls>
                <source src="awareness-video.mp4" type="video/mp4">
                Your browser does not support the video element.
            </video>

        </div>

        <!-- Audio Section -->

        <div class="card">

            <h2>Health Advisory Audio</h2>

            <!-- Replace health-advisory.mp3 with your audio file -->

            <audio controls>
                <source src="health-advisory.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>

        </div>

        <!-- Google Maps Section -->

        <div class="card">

            <h2>Hospital Location</h2>

            <iframe
                src="https://maps.google.com/maps?q=Somaiya%20Vidyavihar%20University&t=&z=15&ie=UTF8&iwloc=&output=embed"
                allowfullscreen=""
                loading="lazy">
            </iframe>

        </div>

        <!-- Noscript -->

        <noscript>
            JavaScript is disabled in your browser.
            Some interactive features may not function properly.
        </noscript>

    </div>

    <footer>
        © 2026 Urine Test Strip Reader System
    </footer>

</body>

</html>
